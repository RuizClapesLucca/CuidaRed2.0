<!doctype html>
<html lang="es">
  <head>
    <!-- Metadatos y estilos de la confirmación de registro. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro exitoso | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
    <script src="/js/script.js" defer></script>
  </head>
  <body>
    <script src="/js/tema.js"></script>
    <!-- Encabezado de la confirmación. -->
    <header class="site-header site-header--auth">
      <a class="brand" href="/Modulo1.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <!-- Mensaje dinámico según el rol registrado. -->
      <section class="auth-card">
        <p class="eyebrow">CUIDARED</p>
        <h1 class="auth-title">¡Felicidades, ya te registraste!</h1>
        <p class="auth-subtitle" id="confirmation-message">Tu cuenta fue creada correctamente.</p>
        <div class="form-actions">
          <a class="btn-primary" href="/auth/iniciar-sesion.html">Iniciar sesión</a>
          <a class="auth-link-muted" href="/Modulo1.html">Volver al inicio</a>
        </div>
      </section>
    </main>
    <!-- Consulta externa del resultado del registro. -->
    <script src="/js/auth/registro-exitoso.js"></script>
  </body>
</html>
