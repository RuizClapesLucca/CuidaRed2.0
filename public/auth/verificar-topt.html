<!doctype html>
<html lang="es">
  <head>
    <!-- Segundo paso del inicio de sesión de administradores (código de la app de autenticación). -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificación en dos pasos | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
  </head>
  <body>
    <script src="/js/tema.js"></script>
    <header class="site-header site-header--auth">
      <a class="brand" href="/Modulo1.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <h1 class="auth-title">Verificación en dos pasos</h1>
      <p class="auth-subtitle">Escribe el código de 6 dígitos de tu app de autenticación.</p>
      <section class="auth-card">
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="totp-form" action="/api/login/totp" method="post">
          <div class="field">
            <label class="field-label" for="codigo">Código</label>
            <input class="field-input" id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
          </div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Continuar</button>
            <a class="auth-link" href="/auth/iniciar-sesion.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/auth/verificar-totp.js"></script>
  </body>
</html>
