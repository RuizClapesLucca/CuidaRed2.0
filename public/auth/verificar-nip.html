<!doctype html>
<html lang="es">
  <head>
    <!-- Verificación del correo con el NIP de 6 dígitos enviado al registrarse. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifica tu correo | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
  </head>
  <body>
    <script src="/js/tema.js"></script>
    <header class="site-header site-header--auth">
      <a class="brand" href="/Modulo1.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <h1 class="auth-title">Verifica tu correo</h1>
      <p class="auth-subtitle">Escribe el NIP de 6 dígitos que te enviamos. Vence en 5 minutos.</p>
      <section class="auth-card">
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <!-- Confirma el NIP y activa la cuenta. -->
        <form id="nip-form" action="/api/registro/verificar" method="post">
          <div class="field">
            <label class="field-label" for="nip">NIP</label>
            <input class="field-input" id="nip" name="nip" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
          </div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Verificar</button>
          </div>
        </form>
        <!-- Solicita un NIP nuevo; el anterior deja de servir. -->
        <form id="resend-form" action="/api/registro/reenviar" method="post">
          <div class="form-actions">
            <button class="auth-link" type="submit">Reenviar NIP</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/auth/verificar-nip.js"></script>
  </body>
</html>
