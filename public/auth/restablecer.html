<!doctype html>
<html lang="es">
  <head>
    <!-- Paso 2 de la recuperación: NIP recibido por correo y contraseña nueva. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
  </head>
  <body>
    <header class="site-header site-header--auth">
      <a class="brand" href="/Modulo1.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <h1 class="auth-title">Define tu nueva contraseña</h1>
      <p class="auth-subtitle">Escribe el NIP de 6 dígitos que recibiste por correo.</p>
      <section class="auth-card">
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="reset-form" action="/api/recuperar/confirmar" method="post">
          <div class="field">
            <label class="field-label" for="correo">Correo electrónico</label>
            <input class="field-input" id="correo" name="correo" type="email" required maxlength="254" autocomplete="email">
          </div>
          <div class="field">
            <label class="field-label" for="nip">NIP</label>
            <input class="field-input" id="nip" name="nip" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
          </div>
          <div class="field">
            <label class="field-label" for="password">Nueva contraseña</label>
            <input class="field-input" id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
          </div>
          <div class="field">
            <label class="field-label" for="confirmar">Confirmar contraseña</label>
            <input class="field-input" id="confirmar" name="confirmar" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
          </div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Guardar contraseña</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/auth/restablecer.js"></script>
  </body>
</html>
