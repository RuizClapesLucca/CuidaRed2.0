<!doctype html>
<html lang="es">
  <head>
    <!-- Paso 1 de la recuperación de contraseña: se pide el correo registrado. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
  </head>
  <body>
    <header class="site-header site-header--auth">
      <a class="brand" href="/Modulo1.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <h1 class="auth-title">Recuperar contraseña</h1>
      <p class="auth-subtitle">Escribe tu correo y te enviaremos un NIP.</p>
      <section class="auth-card">
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="recover-form" action="/api/recuperar" method="post">
          <div class="field">
            <label class="field-label" for="correo">Correo electrónico</label>
            <input class="field-input" id="correo" name="correo" type="email" required maxlength="254" autocomplete="email">
          </div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Enviar NIP</button>
            <a class="auth-link" href="/auth/iniciar-sesion.html">Volver</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/auth/recuperar.js"></script>
  </body>
</html>
