<!doctype html>
<html lang="es">
  <head>
    <!-- Cancelación de una solicitud: pide contraseña y motivo antes de cancelar. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cancelar solicitud | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
  </head>
  <body>
    <header class="site-header site-header--auth">
      <a class="brand" href="/solicitante/solicitar-servicio.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <h1 class="auth-title">Cancelar solicitud</h1>
      <p class="auth-subtitle">Confirma con tu contraseña. Si la solicitud ya fue aceptada, solo se puede cancelar con más de 2 horas de anticipación y con una explicación.</p>
      <section class="auth-card">
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="cancel-form">
          <div class="field">
            <label class="field-label" for="motivo">Motivo</label>
            <select class="field-input" id="motivo" name="id_motivo" required></select>
          </div>
          <div class="field">
            <label class="field-label" for="comentario">Explicación <span class="field-hint">(obligatoria si ya fue aceptada)</span></label>
            <textarea class="field-input field-textarea" id="comentario" name="comentario" maxlength="250"></textarea>
          </div>
          <div class="field">
            <label class="field-label" for="password">Contraseña</label>
            <input class="field-input" id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password">
          </div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Cancelar solicitud</button>
            <a class="auth-link" href="/solicitante/solicitar-servicio.html">Volver</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/common-form.js"></script>
    <script src="/js/cancelar.js"></script>
  </body>
</html>
