<!doctype html>
<html lang="es">
  <head>
    <!-- Levantar una incidencia sobre un servicio, con hasta 3 evidencias (JPG, PNG o PDF). -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Levantar incidencia | CUIDARED</title>
    <link rel="stylesheet" href="/CSS/login-claro.css">
  </head>
  <body>
    <script src="/js/tema.js"></script>
    <header class="site-header site-header--auth">
      <a class="brand" href="/Modulo1.html">CUIDARED</a>
    </header>
    <main class="auth-main">
      <h1 class="auth-title">Levantar incidencia</h1>
      <p class="auth-subtitle">Describe lo que pasó. Puedes adjuntar hasta 3 archivos de 10 MB cada uno.</p>
      <section class="auth-card">
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="report-form">
          <div class="field">
            <label class="field-label" for="motivo">Motivo</label>
            <select class="field-input" id="motivo" name="id_motivo" required></select>
          </div>
          <div class="field">
            <label class="field-label" for="descripcion">Descripción</label>
            <textarea class="field-input field-textarea" id="descripcion" name="descripcion" minlength="20" maxlength="1000" required></textarea>
          </div>
          <div class="field">
            <label class="field-label" for="evidencias">Evidencias <span class="field-hint">(opcional, máximo 3)</span></label>
            <input class="field-input" id="evidencias" name="evidencias" type="file" accept="image/jpeg,image/png,application/pdf" multiple>
          </div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Enviar reporte</button>
            <a class="auth-link" id="back-link" href="/Modulo1.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/common-form.js"></script>
    <script src="/js/reportar.js"></script>
  </body>
</html>
